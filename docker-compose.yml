# Entorno local/servidor sencillo: PostgreSQL + aplicación. Cambie las contraseñas antes de usarlo.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: porcelana
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      POSTGRES_DB: porcelanas
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U porcelana"]
      interval: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://porcelana:${POSTGRES_PASSWORD}@db:5432/porcelanas?schema=public
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:4000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-America/Caracas}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    ports: ["4000:4000"]
    volumes: [storage:/data]
volumes:
  dbdata:
  storage:
